<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060C24"/>
      <stop offset="1" stop-color="#0B1B4D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#1F55F5"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EDF5"/>
      <stop offset="1" stop-color="#B9C2D6"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#4A6BC4" stroke-width="1" opacity="0.18"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1600" height="900" fill="url(#fade)"/></mask>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" mask="url(#gridmask)"/>
  <circle cx="1220" cy="400" r="460" fill="url(#glow)"/>

  <!-- decorative brackets -->
  <g font-family="'SF Mono','Menlo','Consolas',monospace" font-weight="700" fill="none" stroke="#3D7BFF" stroke-width="2" opacity="0.8">
    <text x="930" y="170" font-size="92">&lt;/&gt;</text>
    <text x="1380" y="720" font-size="92">{ }</text>
  </g>
  <g fill="#5B9BFF">
    <circle cx="1530" cy="90" r="5"/><circle cx="1500" cy="90" r="5" opacity="0.6"/><circle cx="1470" cy="90" r="5" opacity="0.3"/>
    <rect x="90" y="90" width="44" height="6" rx="3"/>
  </g>

  <!-- headline -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800">
    <text x="88" y="360" font-size="132" textLength="330" lengthAdjust="spacingAndGlyphs" fill="url(#blue)">WEB</text>
    <text x="88" y="500" font-size="118" textLength="780" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">DEVELOPMENT</text>
  </g>
  <rect x="92" y="540" width="110" height="6" rx="3" fill="#2F6BFF"/>

  <!-- code panel -->
  <g filter="url(#sh)">
    <rect x="90" y="610" width="480" height="190" rx="14" fill="#0C1840" stroke="#2F6BFF" stroke-opacity="0.55"/>
  </g>
  <g fill="#FF6B6B"><circle cx="116" cy="634" r="5"/></g>
  <g fill="#F5C451"><circle cx="134" cy="634" r="5"/></g>
  <g fill="#4ADE80"><circle cx="152" cy="634" r="5"/></g>
  <g font-family="'SF Mono','Menlo','Consolas',monospace" font-size="19" fill="#9FB3E6" xml:space="preserve">
    <text x="116" y="676"><tspan fill="#5B9BFF">&lt;section</tspan> <tspan fill="#C4D4FF">class=</tspan><tspan fill="#7EE0B5">"hero"</tspan><tspan fill="#5B9BFF">&gt;</tspan></text>
    <text x="140" y="706"><tspan fill="#5B9BFF">&lt;h1&gt;</tspan>Build the web<tspan fill="#5B9BFF">&lt;/h1&gt;</tspan></text>
    <text x="116" y="740"><tspan fill="#C4D4FF">.hero</tspan> { <tspan fill="#9FB3E6">display:</tspan> <tspan fill="#7EE0B5">grid</tspan>;</text>
    <text x="140" y="770"><tspan fill="#9FB3E6">color:</tspan> <tspan fill="#5B9BFF">#2F6BFF</tspan>; }</text>
  </g>

  <!-- laptop -->
  <ellipse cx="1220" cy="640" rx="360" ry="22" fill="#000" opacity="0.35"/>
  <g filter="url(#sh)">
    <rect x="940" y="210" width="560" height="350" rx="18" fill="#0E1636" stroke="#3A4A80" stroke-width="2"/>
    <path d="M900 560H1540L1512 592Q1506 602 1494 602H946Q934 602 928 592Z" fill="url(#base)"/>
    <rect x="1170" y="560" width="100" height="10" rx="5" fill="#9AA5BD"/>
  </g>
  <circle cx="1220" cy="220" r="2.5" fill="#3A4A80"/>

  <!-- screen UI -->
  <rect x="956" y="228" width="528" height="316" rx="8" fill="#F5F7FB"/>
  <rect x="956" y="228" width="528" height="36" rx="8" fill="#FFFFFF"/>
  <rect x="976" y="239" width="14" height="14" rx="4" fill="url(#blue)"/>
  <g fill="#C7CEDF">
    <rect x="1330" y="243" width="30" height="6" rx="3"/>
    <rect x="1372" y="243" width="30" height="6" rx="3"/>
    <rect x="1414" y="243" width="30" height="6" rx="3"/>
  </g>
  <rect x="1452" y="238" width="20" height="16" rx="8" fill="#2F6BFF"/>

  <rect x="984" y="300" width="240" height="20" rx="6" fill="#0B1B4D"/>
  <rect x="984" y="330" width="190" height="20" rx="6" fill="#0B1B4D"/>
  <g fill="#B6BFD6">
    <rect x="984" y="366" width="230" height="7" rx="3.5"/>
    <rect x="984" y="381" width="200" height="7" rx="3.5"/>
  </g>
  <rect x="984" y="402" width="112" height="32" rx="16" fill="url(#blue)"/>
  <rect x="1106" y="402" width="92" height="32" rx="16" fill="none" stroke="#B6BFD6" stroke-width="1.5"/>

  <rect x="1290" y="290" width="170" height="150" rx="16" fill="url(#blue)"/>
  <circle cx="1400" cy="350" r="40" fill="#FFFFFF" opacity="0.22"/>
  <circle cx="1350" cy="400" r="26" fill="#0B1B4D" opacity="0.35"/>
  <path d="M1300 430 L1360 372 L1405 415 L1450 380" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <g>
    <rect x="984" y="462" width="150" height="62" rx="10" fill="#FFFFFF" stroke="#E1E6F2"/>
    <rect x="1152" y="462" width="150" height="62" rx="10" fill="#FFFFFF" stroke="#E1E6F2"/>
    <rect x="1320" y="462" width="140" height="62" rx="10" fill="#FFFFFF" stroke="#E1E6F2"/>
    <g fill="#2F6BFF"><rect x="998" y="476" width="22" height="6" rx="3"/><rect x="1166" y="476" width="22" height="6" rx="3"/><rect x="1334" y="476" width="22" height="6" rx="3"/></g>
    <g fill="#C7CEDF">
      <rect x="998" y="492" width="100" height="6" rx="3"/><rect x="998" y="505" width="70" height="6" rx="3"/>
      <rect x="1166" y="492" width="100" height="6" rx="3"/><rect x="1166" y="505" width="70" height="6" rx="3"/>
      <rect x="1334" y="492" width="90" height="6" rx="3"/><rect x="1334" y="505" width="60" height="6" rx="3"/>
    </g>
  </g>

  <!-- floating css chip -->
  <g filter="url(#sh)">
    <rect x="1388" y="590" width="150" height="46" rx="12" fill="#0C1840" stroke="#2F6BFF" stroke-opacity="0.6"/>
  </g>
  <text x="1408" y="620" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="18" fill="#5B9BFF">flex; gap: 16px</text>
</svg>
